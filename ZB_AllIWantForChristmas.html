<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All I Want for Christmas</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f4f8f4;
}

.home-btn{
    position:fixed;
    top:20px;
    left:20px;
    background:#4a90e2;
    color:white;
    text-decoration:none;
    padding:12px 18px;
    border-radius:8px;
    font-weight:bold;
    z-index:1000;
}

.home-btn:hover{
    background:#357abd;
}

/* Header */

.header{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#c1121f,#780000);
    color:white;
    padding:40px;
}

.header-content{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:80px;
    flex-wrap:wrap;
    width:90%;
    max-width:1200px;
}

.header-text{
    max-width:550px;
}

.header h1{
    font-size:4rem;
    margin-bottom:20px;
    letter-spacing:2px;
}

.header p{
    font-size:1.4rem;
    color:#f8f9fa;
    line-height:1.5;
}

.header img{
    width:350px;
    max-width:90%;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

/* Wishlist Section */

.wishlist{
    min-height:70vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:white;
    padding:60px;
}

.wishlist-content{
    width:100%;
    max-width:1000px;
    text-align:center;
}

.wishlist h2{
    font-size:2.5rem;
    margin-bottom:50px;
    color:#c1121f;
}

.wishlist-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:100px;
    text-align:left;
}

.wishlist-grid ul{
    font-size:1.5rem;
    line-height:2.5;
}

.wishlist-grid li{
    margin-bottom:20px;
}

@media (max-width:768px){

    .header-content{
        flex-direction:column;
        text-align:center;
    }

    .header-text{
        text-align:center;
    }

    .header h1{
        font-size:3rem;
    }

    .wishlist-grid{
        grid-template-columns:1fr;
        gap:20px;
    }
}
</style>
</head>

<body>

<a href="index.html" class="home-btn">← Home</a>

<section class="header">

    <div class="header-content">

        <div class="header-text">
            <h1> All I Want for Christmas </h1>

            <p>
                Things I will probably be asking Santa for this Christmas.
            </p>
        </div>

        <img src="A_ChristmasTheo.jpg" alt="Christmas Theo">

    </div>

</section>

<section class="wishlist">

    <div class="wishlist-content">

        <h2> My Christmas Wishlist </h2>

        <div class="wishlist-grid">

            <ul>
                <li>1 Million Dollars</li>
                <li>GTA 6 (Deluxe Edition)</li>
            </ul>

            <ul>
                <li>Any luxury car he has on him</li>
                <li>iPhone 18 Pro Max</li>
            </ul>

        </div>

    </div>

</section>

</body>
</html>
